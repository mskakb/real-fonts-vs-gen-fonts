output_dir: "results/guided/2026-05-21_scorer_H/checkpoints/last"

# モデル・重み（CLI フラグでも指定可。CLI が config を上書きする）
diffusion: null                    # null なら CLI --diffusion 必須。パスを書けば既定として使用
scorer: null                       # null なら CLI --scorer 必須。パスを書けば既定として使用
scorer_use_ema: true               # Scorer の EMA 重みを使用（CLI --no-ema で上書き可）

# 生成条件
charset: "H"
cond_scales: [1.0]                 # リストで複数指定可
realness_scales: [0.0, 1.0, 2.0, 3.0]  # 0.0 = guidance なし (baseline)
n_samples_per_class: 10
sampling_timesteps: [50, 100, 1000]   # リストで複数指定可。1000=フル DDPM

# 後処理
sdf_sharpness: null            # null でハード閾値。20〜50 でソフト sigmoid 変換（ジャギー対策、use_sdf=true のみ有効）

# 実行設定
batch_size: 32
seed: 0
