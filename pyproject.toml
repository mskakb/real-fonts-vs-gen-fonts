[project]
name = "real-fonts-vs-gen-fonts"
version = "0.1.0"
description = "Quantifying, explaining, and guiding the realness of diffusion-generated font glyphs"
readme = "README.md"
license = "MIT"
requires-python = "~=3.12.0"
dependencies = [
    "einops>=0.8.2",
    "ipykernel>=7.2.0",
    "lightning==2.6.1",
    "matplotlib>=3.9.0",
    "pandas>=3.0.2",
    "pillow>=12.1.1",
    "piq>=0.8.0",
    "pyarrow>=24.0.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tensorboard>=2.20.0",
    "torch-ema>=0.3",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchmetrics>=1.0.3",
    "torchvision==0.20.1",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
